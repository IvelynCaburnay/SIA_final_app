
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PetCare</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #eaf3ff, #c9e0ff);
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(18, 74, 130, .15);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: #0867c9;
            font-size: 28px;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #0867c9;
            box-shadow: 0 0 0 3px rgba(8, 103, 201, .1);
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #0867c9;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .submit-button:hover {
            background: #064783;
            transform: translateY(-1px);
        }

        .error-message {
            color: #c62828;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .auth-footer {
            margin-top: 23px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .auth-footer a {
            color: #0867c9;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="auth-card">
        <div class="logo">🐾</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Sign in to your PetCare account.
        </p>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            {% if form.errors %}
                <div class="error-message">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="submit-button">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="{% url 'signup' %}">Create Account</a>
        </div>
    </main>
</body>
</html>
